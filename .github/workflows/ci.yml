name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Demo runs end to end
        run: python -m leastpriv demo --workdir demo_ci
      - name: Experiments reproduce the paper's pattern
        run: |
          python -m experiments.e3_integrity
          python -m experiments.e6_pilot

  test-windows:
    name: test (windows, informational)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
